# Deploys the built app in site/ to Cloudflare Pages whenever it changes on main.
# The two secrets are added once during /setup (GitHub → Settings → Secrets → Actions).
name: deploy
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  deploy:
    # Skipped until /setup writes the project name over the placeholder, so a repo
    # freshly made from the template shows no failed deploy before setup.
    if: ${{ !startsWith('__PROJECT_NAME__', '__') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy site/ to Cloudflare Pages
        working-directory: site          # Pages Functions (the team-code gate) live in site/functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name=__PROJECT_NAME__ --branch=main
