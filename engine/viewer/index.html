<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Action Cricket</title>
  <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="letter.css">
  <script type="module" src="app.js"></script>
  <script type="module" src="screens/rankings.js"></script>
  <script type="module" src="screens/coach.js"></script>
  <script type="module" src="screens/games.js"></script>
  <script type="module" src="screens/players.js"></script>
  <script type="module" src="screens/records.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="badge" id="badge" type="button" aria-label="Team" disabled></button>
      <div class="team-name" id="team-name"></div>
      <a class="icon-btn" id="records-link" href="#/records" aria-label="Records">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z M7 6H4v1a3 3 0 0 0 3 3 M17 6h3v1a3 3 0 0 1-3 3 M12 13v4 M8 20h8 M9 17h6"/></svg>
      </a>
      <select class="scope" id="scope" aria-label="Season"></select>
    </header>
    <main class="view" id="view" tabindex="-1">
      <p class="loading">Loading…</p>
    </main>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/coach" data-route="coach">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z M8 9h8 M8 12h5"/></svg>
        <span>Coach</span>
      </a>
      <a href="#/batting" data-route="batting">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 3.5l2 2-9 9-2-2 9-9Z M9.5 12.5l-6 6 2 2 6-6 M4 20l-1 1"/></svg>
        <span>Batting</span>
      </a>
      <a href="#/bowling" data-route="bowling">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 5.5c2 4 2 9 0 13 M15.5 5.5c-2 4-2 9 0 13"/></svg>
        <span>Bowling</span>
      </a>
      <a href="#/allround" data-route="allround">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v8 M8 8h8 M8 18h8 M5 21h14"/></svg>
        <span>All-round</span>
      </a>
      <a href="#/games" data-route="games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16 M9 3v4 M15 3v4"/></svg>
        <span>Games</span>
      </a>
      <a href="#/players" data-route="players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>Players</span>
      </a>
    </nav>
  </div>
</body>
</html>
